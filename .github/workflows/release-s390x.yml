# Hardened s390x + multi-arch release for dnse-tech/kubectl.
#
# package/Dockerfile downloads dl.k8s.io/release/${KUBERNETES_RELEASE}/bin/${TARGETPLATFORM}/kubectl
# onto scratch and verifies the upstream .sha256 — linux/s390x is published for every relevant
# release, so NO source change is needed; upstream CI simply never targeted s390x.
#
# Unlike the other forks in this cohort we build from the DEFAULT BRANCH, not from a git tag: this
# repo carries no git tag per published image tag (tags stop at v1.29.2 — upstream CI is driven by
# versions.txt). The dispatch `tag` is therefore passed straight through as KUBERNETES_RELEASE.
#
# Hardening: dynamic upstream legs · digest-pinned upstream pulls · immutable combined tag
# (force=true to overwrite) · workflow_dispatch-only · no GitHub Release job.
name: Release s390x

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Kubernetes release to build (e.g., v1.35.2) — also the published image tag"
        required: true
        type: string
      force:
        description: "Overwrite the combined tag if it already exists (treat as immutable otherwise)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kubectl
  UPSTREAM_IMAGE: rancher/kubectl

jobs:
  build-s390x:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout (default branch — Dockerfile is release-agnostic)
        uses: actions/checkout@v4

      - name: Resolve tag
        id: get-tag
        env:
          TAG: ${{ inputs.tag }}        # via env, never inlined into the shell (injection-safe)
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::tag '$TAG' is not a vX.Y.Z Kubernetes release"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The build stage (bci-base) executes curl/useradd on the TARGET platform, so s390x emulation
      # is required here even though nothing is compiled.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push s390x image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: package/Dockerfile
          platforms: linux/s390x
          push: true
          build-args: |
            KUBERNETES_RELEASE=${{ steps.get-tag.outputs.tag }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get-tag.outputs.tag }}-s390x

  create-manifest:
    runs-on: ubuntu-latest
    needs: build-s390x
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to clobber an existing combined tag unless force
        env:
          TAG: ${{ needs.build-s390x.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG"
          if docker buildx imagetools inspect "$IMG" >/dev/null 2>&1; then
            if [ "$FORCE" != "true" ]; then
              echo "::error::$IMG already exists and force=false (tags are immutable). Re-run with force=true to overwrite."
              exit 1
            fi
            echo "::warning::$IMG exists; force=true → overwriting."
          fi

      # Combine the s390x leg with the upstream legs referenced DIRECTLY by digest. No pull/retag/push
      # roundtrip — imagetools copies the digest-pinned upstream manifests into the target repo, so the
      # published per-arch digests match what the orchestrator recorded at preflight.
      - name: Create and push multi-arch manifest (digest-pinned legs)
        env:
          TAG: ${{ needs.build-s390x.outputs.tag }}
          UP: ${{ env.UPSTREAM_IMAGE }}
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          RAW="$(docker buildx imagetools inspect --raw "$UP:$TAG")"
          mapfile -t LEGS < <(echo "$RAW" | jq -r --arg up "$UP" '.manifests[]
            | select(.platform.os=="linux" and .platform.architecture!="unknown")
            | "\($up)@\(.digest)"')
          if [ "${#LEGS[@]}" -eq 0 ]; then
            echo "::error::no real linux upstream legs detected for $UP:$TAG — refusing to publish s390x-only"
            exit 1
          fi
          echo "upstream legs:"; printf '  %s\n' "${LEGS[@]}"
          docker buildx imagetools create -t "$IMG:$TAG" "$IMG:$TAG-s390x" "${LEGS[@]}"
          echo "Created: $IMG:$TAG"

      - name: Verify manifest
        env:
          TAG: ${{ needs.build-s390x.outputs.tag }}
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools inspect "$IMG:$TAG"
          docker buildx imagetools inspect --raw "$IMG:$TAG" \
            | jq -e '[.manifests[].platform.architecture] | index("s390x") != null' >/dev/null \
            || { echo "::error::s390x leg missing from combined manifest"; exit 1; }
